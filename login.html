
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nilesam NGO Login</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">

        <h1>Login to Nilesam NGO</h1>

        <form onsubmit="alert('Form submitted successfully!'); return false;">

            <fieldset>

                <legend>Personal Details</legend>

                <label>Full Name:</label>
                <input type="text"
                       placeholder="Enter Your Name"
                       required>
                <br><br>

                <label>Email:</label>
                <input type="email"
                       placeholder="Enter Your Email"
                       required>
                <br><br>
                      
                     <label>Address:</label>
                    <input type="text" placeholder="Enter your Address"><br><br>


                      <label>State:</label>
                     <input type="text" placeholder="Enter your State" required><br><br>


                     <label>City:</label>
                  <input type="text" placeholder="Enter your City" required><br><br>


                <label>Contact Number:</label>
                <input type="tel"
                       placeholder="Enter Your Contact Number"
                       required>
                <br><br>

                <label>Birth Date:</label>
                <input type="date" required>
                <br><br>

                <label>Gender:</label>
                <br><br>

                <input type="radio" name="gender" value="Male" required>
                Male

                <input type="radio" name="gender" value="Female">
                Female

                <input type="radio" name="gender" value="Other">
                Other

            </fieldset>

            <br>

            <input type="submit" value="Register">

            <input type="reset" value="Clear Form">

        </form>

        <br>

           </div>
<br>

 <a href="index.html">Back to Home</a>



</body>
</html>
